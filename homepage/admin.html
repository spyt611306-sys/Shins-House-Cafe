<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2a23"><title>Shin's House Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<section id="login-view" class="login-view">
  <form id="login-form" class="login-card">
    <img src="/assets/logo-20260928.webp" alt="Shin's House">
    <p class="eyebrow">ADMINISTRATION</p><h1>운영 관리자</h1>
    <label><span>관리자 이메일</span><input type="email" name="email" autocomplete="username" required></label>
    <label><span>비밀번호</span><input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">로그인</button><p id="login-status" class="status" role="status"></p>
  </form>
</section>

<div id="admin-view" class="admin-view" hidden>
  <aside class="sidebar">
    <a href="/" class="admin-brand"><img src="/assets/logo-20260928.webp" alt="Shin's House"></a>
    <nav>
      <button data-tab="dashboard" class="active">대시보드</button>
      <button data-tab="products">제품 관리</button>
      <button data-tab="orders">원두 주문 관리</button>
      <button data-tab="media">홈페이지 이미지</button>
    </nav>
    <div class="sidebar-bottom"><a href="/" target="_blank">홈페이지 보기 ↗</a><a href="/shop.html" target="_blank">구매 페이지 ↗</a><button id="logout">로그아웃</button></div>
  </aside>

  <main class="admin-main">
    <header class="admin-header"><div><p class="eyebrow">SHIN'S HOUSE</p><h1 id="page-title">대시보드</h1></div><button id="refresh" class="ghost-button">새로고침</button></header>
    <p id="global-status" class="global-status" role="status" aria-live="polite"></p>

    <section class="tab-panel active" data-panel="dashboard">
      <div class="metric-grid">
        <article><span>입금 대기/요청</span><strong id="metric-payment">0</strong></article>
        <article><span>상품 준비</span><strong id="metric-shipping">0</strong></article>
        <article><span>재고 부족</span><strong id="metric-stock">0</strong></article>
        <article><span>주문 시스템</span><strong id="metric-commerce">확인 중</strong></article>
      </div>
      <div class="panel-card"><div class="panel-title"><div><p class="eyebrow">OPERATIONS</p><h2>처리해야 할 주문</h2></div><button class="text-button" data-go="orders">주문 관리로 이동 →</button></div><div id="dashboard-orders" class="dashboard-orders"></div></div>
    </section>

    <section class="tab-panel" data-panel="products">
      <div class="panel-card"><div class="panel-title"><div><p class="eyebrow">PRODUCTS</p><h2>원두 제품 관리</h2><p>가격, 재고, 설명, 대표 이미지를 수정하면 구매 화면에 반영됩니다.</p></div></div><div id="product-list" class="product-list"></div></div>
    </section>

    <section class="tab-panel" data-panel="orders">
      <div class="order-toolbar"><input id="order-search" type="search" placeholder="주문번호 · 주문자 · 연락처 검색"><select id="order-filter"><option value="all">전체 상태</option></select></div>
      <div id="order-list" class="order-list"></div>
    </section>

    <section class="tab-panel" data-panel="media">
      <div class="panel-card"><div class="panel-title"><div><p class="eyebrow">HOMEPAGE MEDIA</p><h2>홈페이지 이미지 관리</h2><p>Hero, 로고, 음료 이미지를 직접 교체할 수 있습니다. WEBP/PNG/JPG, 5MB 이하 권장.</p></div><button id="save-media" class="primary-button">변경사항 저장</button></div><div id="media-list" class="media-list"></div></div>
    </section>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/admin.js" defer></script>
</body></html>
