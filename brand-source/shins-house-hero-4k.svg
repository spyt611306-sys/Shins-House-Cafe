<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" role="img" aria-labelledby="title desc">
<title id="title">Shin's House premium coffee hero</title>
<desc id="desc">Warm premium coffee bar atmosphere with roasting, hand drip, coffee beans and Shin's House branding.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#160f0b"/><stop offset=".45" stop-color="#3a2418"/><stop offset="1" stop-color="#0d1712"/></linearGradient>
  <radialGradient id="glow" cx="60%" cy="33%" r="55%"><stop offset="0" stop-color="#e5b873" stop-opacity=".52"/><stop offset=".5" stop-color="#bd7a39" stop-opacity=".15"/><stop offset="1" stop-color="#11110e" stop-opacity="0"/></radialGradient>
  <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#75513a"/><stop offset="1" stop-color="#2b1c15"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9c2a5"/><stop offset=".33" stop-color="#6b625b"/><stop offset=".6" stop-color="#f0ddc1"/><stop offset="1" stop-color="#39342f"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9e6e6" stop-opacity=".38"/><stop offset=".72" stop-color="#b87135" stop-opacity=".25"/><stop offset="1" stop-color="#3a180d" stop-opacity=".75"/></linearGradient>
  <filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".45"/></filter>
  <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse"><circle cx="16" cy="23" r="2.3" fill="#fff" opacity=".035"/><circle cx="66" cy="52" r="1.8" fill="#fff" opacity=".022"/><circle cx="42" cy="12" r="1.2" fill="#000" opacity=".08"/></pattern>
</defs>
<rect width="3840" height="2160" fill="url(#bg)"/>
<rect width="3840" height="2160" fill="url(#glow)"/>
<g opacity=".55" filter="url(#blur40)"><circle cx="3100" cy="340" r="160" fill="#f0c67c"/><circle cx="3360" cy="510" r="95" fill="#e2aa5f"/><circle cx="2750" cy="250" r="80" fill="#e8b86a"/><circle cx="460" cy="350" r="120" fill="#9e6f46"/></g>
<!-- shelving -->
<g opacity=".5"><rect x="2450" y="220" width="1040" height="44" rx="22" fill="#8d603e"/><rect x="2510" y="610" width="940" height="42" rx="21" fill="#68442e"/><rect x="2600" y="970" width="800" height="38" rx="19" fill="#59402e"/>
<g fill="#17130f"><rect x="2680" y="300" width="140" height="240" rx="20"/><rect x="2880" y="350" width="120" height="190" rx="18"/><rect x="3070" y="285" width="150" height="255" rx="20"/><rect x="3270" y="370" width="90" height="170" rx="18"/></g></g>
<!-- roaster -->
<g transform="translate(420 530)" filter="url(#shadow)"><ellipse cx="430" cy="720" rx="360" ry="125" fill="#15100d"/><rect x="125" y="210" width="620" height="610" rx="110" fill="#171a17" stroke="#8d765e" stroke-width="18"/><circle cx="435" cy="500" r="215" fill="#0d0f0d" stroke="url(#metal)" stroke-width="34"/><circle cx="435" cy="500" r="122" fill="#4c2f1d"/><path d="M365 500h140" stroke="#e4c59a" stroke-width="24" stroke-linecap="round"/><rect x="385" y="-5" width="100" height="235" rx="35" fill="url(#metal)"/><path d="M485 40h200c75 0 120 44 120 104v96" fill="none" stroke="#62584e" stroke-width="60" stroke-linecap="round"/></g>
<!-- counter -->
<rect x="0" y="1590" width="3840" height="570" fill="url(#counter)"/>
<path d="M0 1590h3840" stroke="#c89c64" stroke-opacity=".25" stroke-width="8"/>
<!-- pour over -->
<g transform="translate(2390 900)" filter="url(#shadow)"><path d="M320 210h350l-72 330H392z" fill="#f5eadb" stroke="#b99a78" stroke-width="14"/><path d="M395 540h200l85 365H310z" fill="url(#glass)" stroke="#d5c5b2" stroke-width="18"/><path d="M330 770h330" stroke="#532712" stroke-width="80"/><ellipse cx="495" cy="930" rx="210" ry="35" fill="#16110e"/><path d="M113 40c-8-120 75-160 130-60l65 220" fill="none" stroke="#1b1c1a" stroke-width="72" stroke-linecap="round"/><path d="M270 200c80 50 150 120 220 215" fill="none" stroke="#d4d8d2" stroke-width="18" stroke-linecap="round" opacity=".85"/></g>
<!-- coffee beans -->
<g fill="#5a2c17" stroke="#2a130b" stroke-width="7" opacity=".95"><ellipse cx="2070" cy="1760" rx="70" ry="42" transform="rotate(-25 2070 1760)"/><ellipse cx="2200" cy="1845" rx="62" ry="38" transform="rotate(18 2200 1845)"/><ellipse cx="1950" cy="1890" rx="68" ry="40" transform="rotate(42 1950 1890)"/><ellipse cx="2290" cy="1700" rx="57" ry="35" transform="rotate(-52 2290 1700)"/></g>
<g stroke="#b47b50" stroke-width="8" opacity=".55"><path d="M2020 1778q48-40 95-10"/><path d="M2155 1848q45-18 90 8"/><path d="M1910 1872q42 14 78 45"/></g>
<!-- cup foreground -->
<g transform="translate(2980 1530)" filter="url(#shadow)"><ellipse cx="280" cy="455" rx="320" ry="56" fill="#20140e" opacity=".7"/><path d="M55 72h470v280c0 150-106 236-235 236S55 502 55 352z" fill="#173126" stroke="#d4b175" stroke-width="12"/><path d="M525 160c190-28 220 290 28 310" fill="none" stroke="#d4b175" stroke-width="38" stroke-linecap="round"/><ellipse cx="290" cy="91" rx="212" ry="58" fill="#41200f"/><ellipse cx="290" cy="89" rx="175" ry="38" fill="#160b07"/><g fill="#f4e7cf"><text x="290" y="280" text-anchor="middle" font-family="Georgia,serif" font-size="66" font-weight="700">SHIN'S</text><text x="290" y="346" text-anchor="middle" font-family="Georgia,serif" font-size="66" font-weight="700">HOUSE</text></g></g>
<!-- editorial shadow for text legibility -->
<rect x="0" y="0" width="1900" height="2160" fill="url(#bg)" opacity=".45"/>
<rect width="3840" height="2160" fill="url(#grain)"/>
</svg>