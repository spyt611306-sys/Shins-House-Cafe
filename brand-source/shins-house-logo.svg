<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-labelledby="title desc">
  <title id="title">Shin's House</title>
  <desc id="desc">A refined barista dog mascot holding a coffee cup beside the Shin's House wordmark.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7B95E"/>
      <stop offset="1" stop-color="#C58A32"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8E8"/>
      <stop offset="1" stop-color="#F1DFC0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1B140F" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Mascot medallion -->
  <g transform="translate(26 16)" filter="url(#softShadow)">
    <circle cx="112" cy="112" r="102" fill="#F6EFDF" stroke="#2B3D32" stroke-width="7"/>
    <circle cx="112" cy="112" r="91" fill="#FBF7EE" stroke="#D9C7A7" stroke-width="2"/>

    <!-- tail -->
    <path d="M49 145c-20 2-31 18-21 31 8 11 26 9 35-2" fill="none" stroke="#C58A32" stroke-width="13" stroke-linecap="round"/>

    <!-- body/apron -->
    <path d="M74 106c5-21 20-34 39-34 21 0 38 15 42 39l7 59c2 18-11 33-29 33H87c-18 0-31-16-28-34z" fill="url(#gold)" stroke="#32241B" stroke-width="5" stroke-linejoin="round"/>
    <path d="M86 121h51l11 68H75z" fill="#2B3D32" stroke="#1D2A23" stroke-width="4" stroke-linejoin="round"/>
    <path d="M95 129h33" stroke="#F0DFC0" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M105 188v-34c0-8 12-8 12 0v34" fill="none" stroke="#E8D5B4" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- neck/head -->
    <ellipse cx="110" cy="72" rx="43" ry="39" fill="url(#gold)" stroke="#32241B" stroke-width="5"/>
    <path d="M80 49c-20-15-38 1-33 21 5 18 24 23 36 10" fill="#2B3D32" stroke="#32241B" stroke-width="5" stroke-linejoin="round"/>
    <path d="M139 49c18-16 38-2 34 18-4 19-22 25-35 13" fill="#2B3D32" stroke="#32241B" stroke-width="5" stroke-linejoin="round"/>

    <!-- beret -->
    <path d="M73 43c9-24 52-31 72-8 4 5 1 12-5 13-20 4-43 1-62 3-7 1-9-4-5-8z" fill="#2B3D32" stroke="#1D2A23" stroke-width="4"/>
    <path d="M115 23c0-8 13-8 13 0v7" stroke="#2B3D32" stroke-width="5" stroke-linecap="round"/>

    <!-- face -->
    <path d="M78 74c8 25 54 28 65 1-1 23-13 37-33 37-20 0-31-14-32-38z" fill="#F7E4BD" opacity="0.95"/>
    <path d="M86 70c6 5 13 5 19 0" fill="none" stroke="#32241B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="132" cy="70" r="4.5" fill="#32241B"/>
    <path d="M108 79c5-4 10-4 15 0-2 6-13 6-15 0z" fill="#32241B"/>
    <path d="M113 86c3 6 11 8 17 3" fill="none" stroke="#A64D42" stroke-width="4" stroke-linecap="round"/>
    <path d="M117 88c4 7 10 7 14 2-1 10-13 12-18 4z" fill="#B95043"/>

    <!-- left arm -->
    <path d="M74 119c-18 7-24 23-15 39" fill="none" stroke="#C58A32" stroke-width="15" stroke-linecap="round"/>
    <circle cx="62" cy="159" r="9" fill="#DDA94E" stroke="#32241B" stroke-width="4"/>

    <!-- right arm holding cup -->
    <path d="M148 116c15 6 25 18 26 33" fill="none" stroke="#C58A32" stroke-width="15" stroke-linecap="round"/>
    <circle cx="174" cy="150" r="8" fill="#DDA94E" stroke="#32241B" stroke-width="4"/>
    <g transform="translate(164 132)">
      <path d="M0 7h27v18c0 10-6 16-14 16S0 35 0 25z" fill="url(#cream)" stroke="#32241B" stroke-width="4"/>
      <path d="M27 13c13-2 15 17 3 20" fill="none" stroke="#32241B" stroke-width="4" stroke-linecap="round"/>
      <path d="M4 7h19" stroke="#8D5C3A" stroke-width="3" stroke-linecap="round"/>
      <path d="M8 0c-3-6 5-8 2-14M16 0c-3-6 5-8 2-14" fill="none" stroke="#8A6A54" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    </g>

    <!-- legs -->
    <path d="M89 199c-2 13-3 22-2 29M132 199c3 13 4 22 3 29" stroke="#32241B" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(278 0)">
    <text x="0" y="112" fill="#241A14" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="-2.2">SHIN'S HOUSE</text>
    <path d="M3 137H610" stroke="#B88B55" stroke-width="2"/>
    <text x="4" y="173" fill="#6B5240" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="6.5">COFFEE · OBJECTS · GOOD DAYS</text>
    <text x="5" y="208" fill="#8B735F" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" letter-spacing="0.3">A kinder brew for brighter days.</text>
  </g>
</svg>