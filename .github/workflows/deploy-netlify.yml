name: Deploy Shin's House to Netlify

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: netlify-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETLIFY_SITE_ID: 2d6505d3-6549-4ba8-9b33-e738c5981974
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN || secrets.NETLIFY_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify production build
        run: npm run check

      - name: Verify Netlify token is configured
        shell: bash
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "No Netlify deployment token was found in repository secrets."
            echo "Expected one of: NETLIFY_AUTH_TOKEN, NETLIFY_TOKEN, NETLIFY_ACCESS_TOKEN"
            exit 1
          fi

      - name: Deploy production
        run: >-
          npx --yes netlify-cli@latest deploy
          --prod
          --site "$NETLIFY_SITE_ID"
          --auth "$NETLIFY_AUTH_TOKEN"
          --message "GitHub Actions ${GITHUB_SHA}"

      - name: Verify live production
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --max-time 20 https://shinshouse.netlify.app/ > /tmp/home.html
          curl --fail --silent --show-error --max-time 20 https://shinshouse.netlify.app/experience.js > /tmp/experience.js
          curl --fail --silent --show-error --max-time 20 https://shinshouse.netlify.app/assets/hero-cafe-v2.webp > /tmp/hero-cafe-v2.webp
          grep -q 'experience.js' /tmp/home.html
          grep -q '나에게 맞는 원두 찾기' /tmp/experience.js
          grep -q "secondary.src = '/assets/hero-cafe-v2.webp'" /tmp/experience.js
          test "$(wc -c < /tmp/hero-cafe-v2.webp)" -gt 12000

          verified='false'
          for i in {1..12}; do
            if curl --fail --silent --show-error --max-time 20 https://shinshouse.netlify.app/api/health/ready > /tmp/ready.json; then
              verified='true'
            elif curl --fail --silent --show-error --max-time 20 'https://shinshouse.netlify.app/.netlify/functions/commerce?route=health%2Fready' > /tmp/ready.json; then
              echo 'Public health alias is unavailable; verified the deployed commerce function directly.'
              verified='true'
            fi

            if [ "$verified" = 'true' ]; then
              cat /tmp/ready.json
              node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/ready.json', 'utf8'));
          if (data.storage !== 'netlify-blobs') process.exit(2);
          if (data.commerce_ready !== true) process.exit(3);
          NODE
              break
            fi
            sleep 5
          done
          [ "$verified" = 'true' ] || exit 1

          curl --fail --silent --show-error --max-time 20 'https://shinshouse.netlify.app/.netlify/functions/commerce?route=bootstrap' > /tmp/bootstrap.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/bootstrap.json', 'utf8'));
          const products = (data.products || []).filter(p => p.category === 'coffee' && p.active !== false);
          const expected = new Map([['에티오피아 싱글',27000],['고소 블랜딩',22000],['다크 블랜딩',22000]]);
          if (products.length !== 3) process.exit(4);
          for (const product of products) {
            if (!expected.has(product.name) || Number(product.price) !== expected.get(product.name)) process.exit(5);
          }
          if (data.settings?.commerce_ready !== true) process.exit(6);
          NODE

          admin_status=$(curl --silent --output /tmp/admin-login.json --write-out '%{http_code}' --max-time 20 -X POST -H 'Content-Type: application/json' -d '{"email":"invalid@example.com","password":"invalid"}' 'https://shinshouse.netlify.app/.netlify/functions/admin?route=login')
          if [ "$admin_status" = '503' ]; then
            echo 'Admin authentication is not configured yet; storefront deployment remains valid.'
          elif [ "$admin_status" != '403' ] && [ "$admin_status" != '401' ]; then
            cat /tmp/admin-login.json
            echo "Unexpected admin login probe status: $admin_status"
            exit 8
          fi

          echo 'Production verification passed: hero rotation, taste finder, live three-bean catalog and commerce readiness are active.'
