<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15110d"><title>Shin's House</title><style>html,body{margin:0;min-height:100%;background:#15110d;color:#f3ecdf;font-family:system-ui,sans-serif}#boot{min-height:100vh;display:grid;place-items:center;text-align:center}#boot b{font-family:Georgia,serif;font-size:28px}#boot small{display:block;margin-top:8px;opacity:.65}</style></head><body><div id="boot"><div><b>Shin's House</b><small>Loading v4.3…</small></div></div><script>(async()=>{try{const fs=Array.from({length:10},(_,i)=>`bundle-mini/bundle-${String(i+1).padStart(2,'0')}.txt`);const b=(await Promise.all(fs.map(p=>fetch(p).then(r=>{if(!r.ok)throw Error(r.status+' '+p);return r.text()})))).join('');const bin=Uint8Array.from(atob(b),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw Error('최신 브라우저가 필요합니다.');const t=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const k=JSON.parse(t),a={};for(const[n,d]of Object.entries(k.assets))a[n]=`data:image/webp;base64,${d}`;let p=k.html,c=k.css;for(const[n,u]of Object.entries(a)){p=p.split('assets/'+n).join(u);c=c.split('assets/'+n).join(u)}p=p.replace(/<link[^>]*href=["']styles\.css["'][^>]*>/i,`<style>${c}</style>`);const rt=`<script>window.__SHINS_ASSETS__=${JSON.stringify(a)};(function(){const a=window.__SHINS_ASSETS__;function f(e){if(!e||e.nodeType!==1)return;if(e.hasAttribute&&e.hasAttribute('src')){const s=e.getAttribute('src')||'';if(s.startsWith('assets/')&&a[s.slice(7)])e.setAttribute('src',a[s.slice(7)])}if(e.hasAttribute&&e.hasAttribute('style')){let s=e.getAttribute('style')||'';for(const[n,u]of Object.entries(a))s=s.split('assets/'+n).join(u);e.setAttribute('style',s)}if(e.querySelectorAll)e.querySelectorAll('[src],[style]').forEach(f)}new MutationObserver(ms=>ms.forEach(m=>{if(m.type==='attributes')f(m.target);m.addedNodes&&m.addedNodes.forEach(f)})).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src','style']});document.addEventListener('DOMContentLoaded',()=>f(document.documentElement))})();<\/script>`;p=p.replace('</head>',rt+'</head>');document.open();document.write(p);document.close()}catch(e){document.body.innerHTML='<main style="padding:40px"><h1>Shin\'s House</h1><p>페이지 로드 실패</p><pre id="e"></pre></main>';document.getElementById('e').textContent=String(e)}})();</script></body></html>
