<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#15110d">
  <title>Shin's House</title>
  <style>
    html,body{margin:0;min-height:100%;background:#15110d;color:#f3ecdf;font-family:system-ui,sans-serif}
    #boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:28px;box-sizing:border-box}
    #boot b{font-family:Georgia,serif;font-size:28px}
    #boot small{display:block;margin-top:8px;opacity:.65}
    #boot .error{max-width:900px;text-align:left}
    #boot pre{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.55;opacity:.8}
  </style>
</head>
<body>
  <div id="boot"><div><b>Shin's House</b><small>Loading v4.3…</small></div></div>
  <script>
  (async()=>{
    const fail=(stage,error)=>{
      console.error('[Shin\'s House loader]',stage,error);
      document.body.innerHTML=`<main id="boot"><div class="error"><b>Shin's House</b><p>페이지 로드 실패</p><small>단계: ${stage}</small><pre></pre></div></main>`;
      document.querySelector('#boot pre').textContent=String(error?.stack||error);
    };
    const decodeChunk=(text,index)=>{
      const cleaned=text.replace(/[^A-Za-z0-9+/=]/g,'');
      const removed=text.length-cleaned.length;
      if(!cleaned.length) throw new Error(`bundle-${String(index).padStart(2,'0')} 데이터가 비어 있습니다.`);
      if(cleaned.length%4===1) throw new Error(`bundle-${String(index).padStart(2,'0')} Base64 길이 오류: ${cleaned.length}`);
      const normalized=cleaned+'='.repeat((4-cleaned.length%4)%4);
      if(removed>0) console.warn(`[Shin's House] bundle-${String(index).padStart(2,'0')}에서 Base64 외 문자 ${removed}개를 제거했습니다.`);
      try{
        const decoded=atob(normalized);
        return Uint8Array.from(decoded,c=>c.charCodeAt(0));
      }catch(error){
        throw new Error(`bundle-${String(index).padStart(2,'0')} Base64 디코딩 실패: ${error.message}`);
      }
    };
    try{
      const files=Array.from({length:10},(_,i)=>`bundle-mini/bundle-${String(i+1).padStart(2,'0')}.txt`);
      const parts=await Promise.all(files.map(async path=>{
        const response=await fetch(path,{cache:'no-store'});
        if(!response.ok) throw new Error(`${response.status} ${path}`);
        return response.text();
      }));

      const chunks=parts.map((text,i)=>decodeChunk(text,i+1));
      const total=chunks.reduce((sum,chunk)=>sum+chunk.length,0);
      const binary=new Uint8Array(total);
      let offset=0;
      for(const chunk of chunks){binary.set(chunk,offset);offset+=chunk.length;}
      if(!('DecompressionStream' in window)) throw new Error('DecompressionStream을 지원하는 최신 브라우저가 필요합니다.');

      let text;
      try{
        const stream=new Blob([binary]).stream().pipeThrough(new DecompressionStream('gzip'));
        text=await new Response(stream).text();
      }catch(error){
        fail('gzip 해제',error);
        return;
      }

      let payload;
      try{
        payload=JSON.parse(text);
      }catch(error){
        fail('번들 JSON 해석',error);
        return;
      }
      if(!payload||typeof payload.html!=='string'||typeof payload.css!=='string'||!payload.assets){
        throw new Error('v4.3 번들 구조가 올바르지 않습니다.');
      }

      const assets={};
      for(const [name,data] of Object.entries(payload.assets)) assets[name]=`data:image/webp;base64,${data}`;
      let page=payload.html;
      let css=payload.css;
      for(const [name,url] of Object.entries(assets)){
        page=page.split('assets/'+name).join(url);
        css=css.split('assets/'+name).join(url);
      }
      page=page.replace(/<link[^>]*href=["']styles\.css["'][^>]*>/i,`<style>${css}</style>`);

      const runtime=`<script>window.__SHINS_ASSETS__=${JSON.stringify(assets)};(function(){const a=window.__SHINS_ASSETS__;function f(e){if(!e||e.nodeType!==1)return;if(e.hasAttribute&&e.hasAttribute('src')){const s=e.getAttribute('src')||'';if(s.startsWith('assets/')&&a[s.slice(7)])e.setAttribute('src',a[s.slice(7)])}if(e.hasAttribute&&e.hasAttribute('style')){let s=e.getAttribute('style')||'';for(const[n,u]of Object.entries(a))s=s.split('assets/'+n).join(u);e.setAttribute('style',s)}if(e.querySelectorAll)e.querySelectorAll('[src],[style]').forEach(f)}new MutationObserver(ms=>ms.forEach(m=>{if(m.type==='attributes')f(m.target);m.addedNodes&&m.addedNodes.forEach(f)})).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src','style']});document.addEventListener('DOMContentLoaded',()=>f(document.documentElement))})();<\/script>`;
      page=page.replace('</head>',runtime+'</head>');
      document.open();
      document.write(page);
      document.close();
    }catch(error){
      fail('초기화',error);
    }
  })();
  </script>
</body>
</html>
